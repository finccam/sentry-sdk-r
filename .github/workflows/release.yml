name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # Must match the "r" field in rpx.lock; rpx refuses to sync or run on any other R version.
  R_VERSION: '4.5.2'
  RPX_VERSION: '2.1.1'

jobs:
  source:
    name: Source package
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
      - name: Check release version
        id: version
        shell: bash
        run: |
          version=$(awk '$1 == "Version:" {print $2}' DESCRIPTION)
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check lockfile R version
        shell: bash
        run: test "$(jq -r .r rpx.lock)" = "$R_VERSION"
      - name: Build source package
        run: R CMD build --no-build-vignettes --no-manual .
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: sentry.sdk_*.tar.gz
          if-no-files-found: error

  binaries:
    name: ${{ matrix.platform.name }} / R ${{ matrix.r }}
    needs: source
    runs-on: ${{ matrix.platform.runner }}
    defaults:
      run:
        shell: ${{ matrix.platform.shell }}
    strategy:
      fail-fast: false
      matrix:
        r: ['4.5.2']
        platform:
          - name: ubuntu-24.04-x86_64
            runner: ubuntu-24.04
            shell: bash
            rust: stable
          - name: windows-x86_64
            runner: windows-2022
            shell: cmd
            rust: stable-x86_64-pc-windows-gnu
          - name: macos-arm64
            runner: macos-15
            shell: bash
            rust: stable
    steps:
      # The checkout provides DESCRIPTION and rpx.lock for rpx; the package itself
      # is installed from the source tarball built above.
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.platform.rust }}
      # rpx builds R packages from source on Linux. System libraries for every package in
      # rpx.lock (checked against Posit Package Manager sysreqs for ubuntu 24.04):
      #   curl: libcurl4-openssl-dev libssl-dev | httpuv: make zlib1g-dev
      #   sodium: libsodium-dev | stringi: libicu-dev
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev make zlib1g-dev libsodium-dev libicu-dev
      - name: Install rpx (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -LsSf "https://github.com/scalerail-solutions/rpx/releases/download/v${RPX_VERSION}/rpx-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install rpx (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm "https://github.com/scalerail-solutions/rpx/releases/download/v$env:RPX_VERSION/rpx-installer.ps1" | iex
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Sync locked R dependencies
        run: rpx sync --no-install-project
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: source
      - name: Compile binary package
        run: rpx run R CMD INSTALL --build --no-multiarch source/sentry.sdk_${{ needs.source.outputs.version }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform.name }}-${{ matrix.r }}
          path: sentry.sdk_*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [source, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries
      - name: Bundle binaries by matrix target
        run: |
          for directory in binaries/*; do
            name=$(basename "$directory")
            zip -j "release/$name.zip" "$directory"/*
          done
      - name: Checksums and download table
        working-directory: release
        env:
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          sha256sum * > SHA256SUMS
          {
            echo '## Downloads'
            echo
            echo 'Binary bundles are labeled by platform, architecture, and R version.'
            echo 'Extract the outer ZIP, then run R CMD INSTALL on the package archive inside.'
            echo 'Linux binaries target Ubuntu 24.04.'
            echo
            echo '| Artifact | Download |'
            echo '| --- | --- |'
            for file in *; do
              echo "| $file | [Download]($RELEASE_URL/$file) |"
            done
          } > ../release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --draft --title "$TAG" \
            --generate-notes --notes-file release-notes.md
          gh release upload "$TAG" release/*
          gh release edit "$TAG" --draft=false
